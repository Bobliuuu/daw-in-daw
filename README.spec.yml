  caption: "Explainer video (voice-over and captions): the idea, how it works, what is tested, and what is not"
  mp4: video/daw_in_daw_explainer.mp4
  gif: video/preview.gif
  srt: video/daw_in_daw_explainer.srt
  poster: video/poster.png
  out_dir: video/.render
  fps: 24
  max_mb: 22
  render_crf: 18
  concurrency: 4
  music: true
  voice: {engine: openai, voice: alloy, model: gpt-4o-mini-tts, tempo: 1.2}
  scenes:
    - type: title
      title: DAW in DAW
      subtitle: A multitrack DAW in pure Lua, inside REAPER
      chips: [pure Lua, gfx, real REAPER state]
      say: "DAW in DAW: a complete multitrack digital audio workstation, written in pure Lua, running inside REAPER."
    - type: problem
      heading: "The idea"
      bullets:
        - "REAPER supplies audio engine, MIDI, undo, render, save format"
        - "This project supplies the application on top"
        - "Arrangement, piano roll, mixer, effects, export: all drawn by the script"
        - "No second model, no second audio engine"
      say: "Think Neovim inside Neovim. REAPER supplies the host primitives: the audio engine, MIDI, undo, rendering and the save format. This project supplies the whole application on top: its own arrangement view, piano roll, mixer, effects rack and export dialog, all drawn with REAPER's built in graphics A P I."
    - type: architecture
      diagram: flow
      heading: "One project, two interfaces"
      say: "There is no second model and no second audio engine. Every track, clip, note, fader and effect is a REAPER object, so the same project opens in REAPER's normal interface as ordinary tracks, items and F X chains. Edits from either side show up in the other. Every edit is one native undo point."
    - type: stat
      number: src_lines
      kicker: "lines of Lua in {{ n.src_files.text }} files"
      label: "lines"
      sub: "ReaScript and gfx only: no ReaImGui, SWS, Python or external processes"
      say: "It is {{ n.src_lines.numtext }} lines of Lua in {{ n.src_files.numtext }} files, with no dependencies beyond ReaScript and gfx. Copy the folder and run daw dot lua."
    - type: table
      table: tests_tbl
      heading: "Tests"
      say: "The repo's generated test report shows {{ n.total.numtext }} automated checks across {{ n.suites.numtext }} suites, with {{ n.failed.numtext }} failures. {{ n.unit.numtext }} are pure Lua unit tests that need no REAPER, and the rest run inside a real REAPER."
    - type: chart
      chart: perf
      say: "Performance is measured, not assumed. With {{ n.b_tracks.numtext }} tracks, {{ n.b_clips.numtext }} clips and {{ n.b_notes.numtext }} notes, user interface work per frame averages {{ n.idle_ms.numtext }} milliseconds idle, {{ n.drag_ms.numtext }} while dragging a clip, and {{ n.play_ms.numtext }} during playback, against a thirty three millisecond budget."
    - type: caveats
      heading: "Honest status"
      bullets:
        - "Tested on macOS and REAPER 7.39 on Apple Silicon only"
        - "OS-level GUI event tests were written but have not been run to completion"
        - "One tempo and time signature at the start; no automation or recording"
        - "Export is REAPER's master mix"
      say: "The honest status. It is tested on macOS with REAPER seven point three nine on Apple Silicon only. The tests that post real operating system mouse and keyboard events were written, but need a macOS permission that was not available, so they have not been run to completion. The app's real frame loop is exercised with synthetic input instead. There is one tempo, no automation lanes, and no audio recording."
    - type: end
      title: DAW in DAW
      subtitle: "./run.sh examples/neon_drive.rpp"
      say: "Clone the repo, run run dot s h with the example song, and listen to what it made."

